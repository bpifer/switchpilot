# Publishes versioned, multi-arch container images to GitHub Container Registry
# when a version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# produces  ghcr.io/bpifer/switchpilot-api:{1.0.0,latest}
#           ghcr.io/bpifer/switchpilot-web:{1.0.0,latest}
#
# Uses the built-in GITHUB_TOKEN (packages: write) - no extra secrets needed.
# After the first release, make both packages public in the GitHub UI
# (Packages → package → settings → Change visibility) so `docker pull` works
# without authentication.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: switchpilot-api
            context: ./backend
          - image: switchpilot-web
            context: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4      # arm64 emulation for cross-build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
