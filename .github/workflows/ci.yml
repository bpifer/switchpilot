name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchpilot
          POSTGRES_PASSWORD: switchpilot
          POSTGRES_DB: switchpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U switchpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: switchpilot
      POSTGRES_PASSWORD: switchpilot
      POSTGRES_DB: switchpilot
      RUN_DB_TESTS: '1'   # enables the HTTP route tests (tests/api.test.ts)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package.json }
      - run: npm install
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t switchpilot-api ./backend
      - run: docker build -t switchpilot-web ./frontend
      # push to your registry here, e.g.:
      # - run: docker tag switchpilot-api ghcr.io/${{ github.repository }}/api:${{ github.sha }} && docker push ...
