version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    # Two PRs max per week (minors bundle, majors bundle) instead of one email
    # per dependency.
    groups:
      backend-minor:
        update-types: [minor, patch]
      backend-major:
        patterns: ["*"]
        update-types: [major]
    # Fastify-v5-only plugin majors are deferred until we migrate Fastify
    # itself (one deliberate migration, not piecemeal bot bumps).
    ignore:
      - dependency-name: fastify
        update-types: [version-update:semver-major]
      - dependency-name: "@fastify/*"
        update-types: [version-update:semver-major]
      # otplib 13 is a ground-up rewrite of the TOTP API. MFA verification is
      # not a bot-bump; migrate deliberately with lockout testing, or not at
      # all (v12 is advisory-free).
      - dependency-name: otplib
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor:
        update-types: [minor, patch]
      frontend-major:
        patterns: ["*"]
        update-types: [major]
    # React 19 + Vite 8 + recharts 3 migration DONE 2026-07-11, so those major
    # ignores are lifted. Tailwind 4 (new engine/config) is still deferred to a
    # deliberate migration.
    ignore:
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
