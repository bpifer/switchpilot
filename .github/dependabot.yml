version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-minor:
        update-types: [minor, patch]
    # Fastify-v5-only plugin majors are deferred until we migrate Fastify
    # itself (one deliberate migration, not piecemeal bot bumps).
    ignore:
      - dependency-name: fastify
        update-types: [version-update:semver-major]
      - dependency-name: "@fastify/*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor:
        update-types: [minor, patch]
    # React 19 / Vite 8 wave is deferred to a deliberate migration; the bot
    # PRs fail frontend build/tests today.
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
