# SwitchPilot Kubernetes manifests (namespace: switchpilot)
# Create switchpilot-secrets first - see docs/DEPLOYMENT.md.
#
# PRODUCTION NOTE: the in-cluster Postgres and Redis below are single-replica with
# no HA and no backups - fine for evaluation, not for production. For real
# deployments point POSTGRES_HOST/REDIS_URL at a managed service (RDS, Cloud SQL,
# ElastiCache) or a proper HA operator, and delete the db/redis resources here.
apiVersion: apps/v1
kind: Deployment
metadata: { name: db, labels: { app: db } }
spec:
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: switchpilot }
            - { name: POSTGRES_USER, value: switchpilot }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: switchpilot-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: switchpilot-pgdata }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: switchpilot-pgdata }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: db }
spec:
  selector: { app: db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, labels: { app: api } }
spec:
  replicas: 2   # scaling needs RWX storage for firmware + config-history (see the PVCs below). Cron sweeps run only on the leader (Postgres advisory lock), and per-device SSH access is serialized cluster-wide by a Redis lock in the session pool, so a UI write on one replica can't race a sweep on another.
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: switchpilot-api:latest   # replace with your registry path
          env:
            - { name: POSTGRES_HOST, value: db }
            - { name: POSTGRES_DB, value: switchpilot }
            - { name: POSTGRES_USER, value: switchpilot }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: ENABLE_API_DOCS, value: "false" }   # hide the API schema in prod
            # CORS allow-list. REQUIRED: change to your real frontend origin before deploying;
            # removing this line makes the API reflect any Origin (dev behaviour, CSRF risk).
            - { name: ALLOWED_ORIGINS, value: "https://switchpilot.example.com" }
            # Syslog ingest (UDP 514) is NOT exposed by the Service below; switches cannot
            # reach it through the HTTP Ingress. To receive syslog in K8s, add a separate
            # LoadBalancer/NodePort Service for UDP, or set SYSLOG_PORT > 1024 and expose it.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: switchpilot-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: switchpilot-secrets, key: JWT_SECRET } }
            - name: CREDENTIAL_KEY
              valueFrom: { secretKeyRef: { name: switchpilot-secrets, key: CREDENTIAL_KEY } }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: firmware, mountPath: /data/firmware }
            - { name: confighistory, mountPath: /data/config-history }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: firmware
          persistentVolumeClaim: { claimName: switchpilot-firmware }
        - name: confighistory
          persistentVolumeClaim: { claimName: switchpilot-confighistory }
---
# api runs replicas: 2 (above), so BOTH the firmware images and the config-history
# git repo must be shared (ReadWriteMany) - otherwise each pod keeps its own copy
# (divergent git history for backups/diff/rollback), and a ReadWriteOnce volume
# leaves the second pod Pending on a multi-node cluster. ReadWriteMany needs an
# RWX-capable StorageClass (NFS, CephFS, EFS, Azure Files). If your cluster only
# offers ReadWriteOnce: set api replicas to 1, or externalize both - firmware to
# object storage and config-history via CONFIG_HISTORY_REMOTE.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: switchpilot-firmware }
spec:
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: switchpilot-confighistory }
spec:
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: switchpilot-web:latest   # replace with your registry path
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: switchpilot
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2g
    # Keep WebSocket (/ws) connections alive; default 60s read timeout would
    # drop idle realtime sockets every minute.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: switchpilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
