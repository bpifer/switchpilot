server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. Everything is self-hosted (no CDNs/fonts);
    # scripts are Vite-built external files, so script-src stays 'self' with no
    # unsafe-inline - the main XSS hardening given JWTs live in localStorage.
    # style 'unsafe-inline' covers React style={} attributes; ws:/wss: covers
    # the /ws live socket on browsers that don't match ws under 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2g;
        proxy_read_timeout 300s;
    }
    # WebSocket for real-time alerts, job progress, and the live indicator.
    # Needs the Upgrade/Connection headers or the handshake never completes.
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep idle sockets open (events can be sparse)
    }
    location /docs {
        proxy_pass http://api:3000;
        # Swagger UI runs inline scripts, which the SPA CSP above would block.
        # Declaring any add_header here stops inheriting the server-level set
        # (nginx replaces, not merges), so /docs gets only this header.
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri /index.html;
    }
}
