server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2g;
        proxy_read_timeout 300s;
    }
    # WebSocket for real-time alerts, job progress, and the live indicator.
    # Needs the Upgrade/Connection headers or the handshake never completes.
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep idle sockets open (events can be sparse)
    }
    location /docs {
        proxy_pass http://api:3000;
    }
    location / {
        try_files $uri /index.html;
    }
}
